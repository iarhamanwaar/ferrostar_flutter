name: ferrostar_flutter
description: >-
  Turn-by-turn navigation for Flutter without Mapbox or Google. A headless bridge
  to the open-source Ferrostar core: maneuvers, exits, voice text, off-route.
version: 0.1.3

repository: https://github.com/iarhamanwaar/ferrostar_flutter
issue_tracker: https://github.com/iarhamanwaar/ferrostar_flutter/issues
screenshots:
  - description: Exit banner with exit number and spoken instruction.
    path: doc/images/01-exit-banner.png
  - description: Off-route state raised after a detour.
    path: doc/images/02-off-route.png
  - description: Arrival banner at the end of the route.
    path: doc/images/03-arrive.png
topics:
  - navigation
  - turn-by-turn
  - maps
  - maplibre
  - ferrostar

environment:
  sdk: ^3.11.0
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  pigeon: ^26.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.ferrostarflutter
        pluginClass: FerrostarFlutterPlugin
      ios:
        pluginClass: FerrostarFlutterPlugin
        sharedDarwinSource: false
